[env:seeed-xiao-s3]
custom_meshtastic_hw_model = 81
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Seeed Xiao ESP32-S3
custom_meshtastic_images = seeed-xiao-s3.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board = seeed-xiao-s3
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_unflags =
  ${esp32s3_base.build_unflags}
  -DARDUINO_USB_MODE=1
build_flags =
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -I variants/esp32s3/seeed_xiao_s3
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0

; ---------------------------------------------------------------------------
; EV charger monitor envs (project: ev-charger-project)
;
; Both envs extend the seeed-xiao-s3 board profile and only differ in which
; custom modules they compile in via MESHTASTIC_EV_MONITOR_* flags.
;
; For the home env, set these env vars in your build shell so secrets stay
; out of committed source:
;   export EV_TELEGRAM_BOT_TOKEN="123456:ABC..."
;   export EV_TELEGRAM_CHAT_ID="987654321"
;
; Build:
;   pio run -e ev-monitor-garage -t upload
;   pio run -e ev-monitor-home -t upload
; ---------------------------------------------------------------------------

[env:ev-monitor-garage]
extends = env:seeed-xiao-s3
build_flags =
  ${env:seeed-xiao-s3.build_flags}
  -D MESHTASTIC_EV_MONITOR_GARAGE=1
lib_deps =
  seeed-studio/Seeed_Arduino_SSCMA @ ^1.0.0

[env:ev-monitor-home]
extends = env:seeed-xiao-s3
build_flags =
  ${env:seeed-xiao-s3.build_flags}
  -D MESHTASTIC_EV_MONITOR_HOME=1
  -D EV_TELEGRAM_BOT_TOKEN=\"${sysenv.EV_TELEGRAM_BOT_TOKEN}\"
  -D EV_TELEGRAM_CHAT_ID=\"${sysenv.EV_TELEGRAM_CHAT_ID}\"
